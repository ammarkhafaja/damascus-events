                <div class="collapse navbar-collapse" id="mainNav">

                    </ul>
                </div>
            </nav>
        </header>
        <hr>
        <main>
            <div class="card">
                <div class="card-body">
                    <form id="contact-form" method="post" action="#">
                <fieldset>
                    <legend>Personal Information</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstname">First Name: <span class="required" aria-label="required">*</span></label>
                            <input type="text" id="firstname" name="firstname" class="input" placeholder="First Name" required autofocus aria-required="true" aria-describedby="firstname-error" />
                        </div>
                        <div class="form-group">
                            <label for="lastname">Last Name: <span class="required" aria-label="required">*</span></label>
                            <input type="text" id="lastname" name="lastname" class="input" placeholder="Last Name" required aria-required="true" aria-describedby="lastname-error" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">E-Mail: <span class="required" aria-label="required">*</span></label>
                        <input type="email" id="email" name="email" class="input" placeholder="your.email@example.com" required aria-required="true" aria-describedby="email-error" />
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone: <span class="required" aria-label="required">*</span></label>
                        <input type="tel" id="phone" name="phone" class="input" placeholder="+963 930 221 387" required aria-required="true" aria-describedby="phone-error" />
                    </div>
                    <div class="form-group">
                        <label for="address">Address: <span class="required" aria-label="required">*</span></label>
                        <input type="text" id="address" name="address" class="input" placeholder="Street, City, Country" required aria-required="true" aria-describedby="address-error" />
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Message Details</legend>
                    <div class="form-group">
                        <label for="subject">Subject: <span class="required" aria-label="required">*</span></label>
                        <input type="text" id="subject" name="subject" class="input" placeholder="Message Subject" required aria-required="true" aria-describedby="subject-error" />
                    </div>
                    <div class="form-group">
                        <label for="message">Message: <span class="required" aria-label="required">*</span></label>
                        <textarea id="message" name="message" class="input" placeholder="Your message here..." rows="5" required aria-required="true" aria-describedby="message-error"></textarea>
                    </div>
                </fieldset>
                <div class="actions">
                    <input type="submit" value="Submit" class="btn btn-primary" />
                    <input type="reset" value="Reset" class="btn btn-outline" />
                </div>
                    </form>
                </div>
            </div>
        </main>
        <hr class="my-4">

        <footer class="footer mt-4 bg-light py-3">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 col-md-6 mb-3 mb-md-0 text-center text-md-start">

                            <i class="fa fa-copyright"></i>
                            Copy Right reserved 2026
                        </p>
                        <p class="small mb-0">

                            <a href="tel:00963930221387" class="ms-2 text-decoration-none">
                                <i class="fas fa-phone"></i> Mobile
                            </a>
                            <a href="mailto:ammarkhafaja92@gmail.com" class="ms-3 text-decoration-none">
                                <i class="fas fa-envelope-open"></i> Mail
                            </a>
                        </p>
                    </div>
                    <div class="col-12 col-md-6 text-center text-md-end">
                        <p class="small mb-1">Follow us</p>
                        <div class="social d-flex justify-content-center justify-content-md-end gap-3">
                            <a href="https://www.facebook.com" title="Facebook" class="text-decoration-none" aria-label="Facebook">
                                <i class="fab fa-facebook"></i>
                            </a>
                            <a href="https://www.instagram.com" title="Instagram" class="text-decoration-none" aria-label="Instagram">
                                <i class="fab fa-instagram"></i>
                            </a>
                            <a href="https://www.twitter.com" title="X" class="text-decoration-none" aria-label="X">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a href="https://www.youtube.com" title="Youtube" class="text-decoration-none" aria-label="Youtube">
                                <i class="fab fa-youtube"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
